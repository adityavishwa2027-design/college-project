services:
  - type: web
    name: events-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
  - type: web
    name: campusverse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: printf 'window.CAMPUS_API_URL = "%s";\n' "$CAMPUS_API_URL" > api-config.js
    staticPublishPath: .
    envVars:
      - key: CAMPUS_API_URL
        fromService:
          name: events-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
